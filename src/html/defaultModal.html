<head>
  <link rel="stylesheet" href="../../css/modal.css" />
</head>
<div class="modal" id="scheduleView">
  <div class="modal-content" id="modalChild">
    <div class="modal-header">
      <div
        class="close"
        onclick="document.getElementById('modalBody').innerHTML = ''; document.getElementById('scheduleView').style.display = 'none';"
      >
        &times;
      </div>
      <h2 style="color: red; font-weight: bold; font-size: 1.5em; margin: auto">
        Error creating schedule!
      </h2>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer"></div>
  </div>
</div>
